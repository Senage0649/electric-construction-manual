<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2933">
  <title>電気施工管理 施工図教材</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <p class="eyebrow">新築工事編</p>
        <h1>電気施工管理<br>施工図教材</h1>
      </div>
      <button id="menuButton" class="icon-button" aria-label="項目一覧">☰</button>
    </header>

    <section class="hero">
      <p>現場で「何を見る・誰に聞く・何を残す」を確認するスマホ教材です。</p>
      <div class="hero-flow"><span>図面</span><span>現地</span><span>他業者</span><span>写真</span><span>法規</span></div>
    </section>

    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="例：スリーブ、接地、消防、チェックリスト">
    </div>

    <nav id="categoryTabs" class="category-tabs" aria-label="カテゴリ"></nav>

    <main class="layout">
      <aside id="chapterList" class="chapter-list"></aside>
      <article id="content" class="content"></article>
    </main>
  </div>

  <button id="topButton" class="top-button" aria-label="上へ戻る">↑</button>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
